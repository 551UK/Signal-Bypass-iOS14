name: Keep only confirmed Signal baselines
on:
  push:
    branches: [main]
    paths: [.github/workflows/retain-two-baseline-debs.yml]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == '551UK/Signal-Bypass-iOS14'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Keep original 1.4.6 and 1.5.13 DEBs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          repo = "551UK/Signal-Bypass-iOS14"
          assert os.environ["GITHUB_REPOSITORY"] == repo
          base = "https://api.github.com/repos/" + repo
          targets = [{"id":583772532,"name":"uk.551.signalbypass14_1.5.15_iphoneos-arm.deb","tag":"v1.5.15"},{"id":583709617,"name":"uk.551.signalbypass14_1.5.14_iphoneos-arm.deb","tag":"v1.5.14"},{"id":582784247,"name":"uk.551.signalbypass14_1.5.12_iphoneos-arm.deb","tag":"v1.5.12"},{"id":582748052,"name":"uk.551.signalbypass14_1.5.11_iphoneos-arm.deb","tag":"v1.5.11"},{"id":582732156,"name":"uk.551.signalbypass14_1.5.10_iphoneos-arm.deb","tag":"v1.5.10"},{"id":582701812,"name":"uk.551.signalbypass14_1.5.9_iphoneos-arm.deb","tag":"v1.5.9"},{"id":582679034,"name":"uk.551.signalbypass14_1.5.8_iphoneos-arm.deb","tag":"v1.5.8"},{"id":582549063,"name":"uk.551.signalbypass14_1.5.7_iphoneos-arm.deb","tag":"v1.5.7"},{"id":582533154,"name":"uk.551.signalbypass14_1.5.6_iphoneos-arm.deb","tag":"v1.5.6"},{"id":582514638,"name":"uk.551.signalbypass14_1.5.5_iphoneos-arm.deb","tag":"v1.5.5"},{"id":582501057,"name":"uk.551.signalbypass14_1.5.4_iphoneos-arm.deb","tag":"v1.5.4"},{"id":582486023,"name":"uk.551.signalbypass14_1.5.3_iphoneos-arm.deb","tag":"v1.5.3"},{"id":582469799,"name":"uk.551.signalbypass14_1.5.2_iphoneos-arm.deb","tag":"v1.5.2"},{"id":582447215,"name":"uk.551.signalbypass14_1.5.1_iphoneos-arm.deb","tag":"v1.5.1"},{"id":582439159,"name":"uk.551.signalbypass14_1.5.0_iphoneos-arm.deb","tag":"v1.5.0"},{"id":582416451,"name":"uk.551.signalbypass14_1.4.9_iphoneos-arm.deb","tag":"v1.4.9"},{"id":582359420,"name":"uk.551.signalbypass14_1.4.8_iphoneos-arm.deb","tag":"v1.4.8"},{"id":582318948,"name":"uk.551.signalbypass14_1.4.7_iphoneos-arm.deb","tag":"v1.4.7"}]
          keep = [{"tag":"v1.5.13","id":582851900,"name":"uk.551.signalbypass14_1.5.13_iphoneos-arm.deb","digest":"sha256:164fbc4dfd13bac4f9e997f7a3dd2b08a36f43fac25b724e2e30dfe0297cca18","size":1158768},{"tag":"v1.4.6","id":582267164,"name":"uk.551.signalbypass14_1.4.6_iphoneos-arm.deb","digest":"sha256:6cb6260397d02cb526ee75a5093b616a166366a95330f1c9432c5d3fd5c1f3c6","size":39296}]
          def api(path, method="GET", data=None):
              request = urllib.request.Request(base + path, method=method, data=None if data is None else json.dumps(data).encode(), headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json", "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          def inventory():
              result = {}
              page = 1
              while True:
                  releases = api("/releases?per_page=100&page=" + str(page))
                  for release in releases:
                      for asset in release["assets"]:
                          result[asset["id"]] = {"id": asset["id"], "name": asset["name"],
                              "tag": release["tag_name"], "digest": asset.get("digest"), "size": asset["size"]}
                  if len(releases) < 100:
                      return result
                  page += 1
          release_targets = [{"id":394659061,"tag":"v1.5.15"},{"id":394626336,"tag":"v1.5.14"},{"id":394258780,"tag":"v1.5.12"},{"id":394245228,"tag":"v1.5.11"},{"id":394241166,"tag":"v1.5.10"},{"id":394234151,"tag":"v1.5.9"},{"id":394229257,"tag":"v1.5.8"},{"id":394205941,"tag":"v1.5.7"},{"id":394202744,"tag":"v1.5.6"},{"id":394198410,"tag":"v1.5.5"},{"id":394195197,"tag":"v1.5.4"},{"id":394191628,"tag":"v1.5.3"},{"id":394188087,"tag":"v1.5.2"},{"id":394182669,"tag":"v1.5.1"},{"id":394180398,"tag":"v1.5.0"},{"id":394173950,"tag":"v1.4.9"},{"id":394158105,"tag":"v1.4.8"},{"id":394145057,"tag":"v1.4.7"},{"id":394111970,"tag":"v1.4.5"},{"id":394004721,"tag":"v1.4.4"},{"id":393993102,"tag":"v1.4.3"},{"id":393979269,"tag":"v1.4.2"},{"id":393976884,"tag":"v1.4.1"},{"id":393970105,"tag":"v1.4.0"},{"id":393959818,"tag":"v1.3.0"},{"id":393935779,"tag":"v1.2.0"},{"id":393915255,"tag":"v1.1.1"},{"id":393908482,"tag":"v1.1.0"},{"id":393893493,"tag":"v1.0.4"},{"id":393888439,"tag":"v1.0.3"},{"id":393858942,"tag":"v1.0.1.1"},{"id":393859798,"tag":"v1.0.1"},{"id":393847802,"tag":"v1.0.0"},{"id":393842726,"tag":"v0.9.0"},{"id":393829251,"tag":"v0.8.0"},{"id":393789623,"tag":"v0.7.0"},{"id":393779732,"tag":"v0.6.0"},{"id":393768202,"tag":"v0.5.0"},{"id":393756384,"tag":"v0.4.0"},{"id":393743631,"tag":"v0.3.0"},{"id":393738376,"tag":"v0.2.0"},{"id":393728746,"tag":"v0.1.0"}]
          retained_releases = [{"id":394275322,"tag":"v1.5.13"},{"id":394126430,"tag":"v1.4.6"}]
          for release in release_targets + retained_releases:
              current = api("/releases/" + str(release["id"]))
              assert current["tag_name"] == release["tag"], "Release identity changed"
          before = inventory()
          assert len(targets) == 18
          keep_ids = {item["id"] for item in keep}
          for item in keep:
              assert before.get(item["id"]) == item, "Protected DEB changed; stopping"
          for item in targets:
              current = before.get(item["id"])
              assert current and all(current[k] == v for k, v in item.items()), "Deletion target changed"
              assert item["id"] not in keep_ids and item["name"].endswith(".deb")
          assert {i for i, a in before.items() if a["name"].endswith(".deb")} == keep_ids | {a["id"] for a in targets}
          for item in targets:
              api("/releases/assets/" + str(item["id"]), "DELETE")
              print("Deleted " + item["tag"] + ": " + item["name"], flush=True)
          for release in release_targets:
              api("/releases/" + str(release["id"]), "DELETE")
              print("Removed obsolete release " + release["tag"], flush=True)
          for release in sorted(retained_releases, key=lambda r: r["tag"]):
              api("/releases/" + str(release["id"]), "PATCH", {
                  "draft": False, "prerelease": False,
                  "make_latest": "true" if release["tag"] == "v1.5.13" else "false"})
          remaining_releases = api("/releases?per_page=100")
          assert {r["id"] for r in remaining_releases} == {r["id"] for r in retained_releases}
          assert api("/releases/latest")["tag_name"] == "v1.5.13"
          after = inventory()
          assert all(after.get(item["id"]) == item for item in keep)
          assert {i for i, a in after.items() if a["name"].endswith(".deb")} == keep_ids
          summary = "Verified exactly two unchanged DEBs remain: v1.4.6 and v1.5.13. Deleted 18 other DEBs and removed 42 obsolete release entries. v1.5.13 is latest."
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary + "\n")
          

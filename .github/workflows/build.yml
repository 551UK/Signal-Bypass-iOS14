name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.4.0-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental rootful build for Signal 7.19.1 (208) on iOS 14.

          v1.4.0 removes the crash-prone pure-Swift expiry hooks introduced by v1.3.0.

          The successful Signal 8.29 iOS 16 registration trace showed the initial POST /v1/verification/session using:
          User-Agent: Signal-iOS/8.29.0.1866 iOS/16.2
          and receiving HTTP 200.

          The failing iOS 14 capture showed the same endpoint seeing Signal-iOS/7.19.1.208 iOS/14.x and returning HTTP 499.

          v1.4.0 therefore makes one runtime change only: it hooks the final concrete NSURLSession upload/data-task methods and replaces User-Agent only for Signal /v1/verification/session traffic, after Signal has finished preparing the request. It does not rewrite HTTP statuses, add X-Signal-Agent, patch Swift expiry functions, or alter request bodies.

          The installer uses fresh local identity 8.29.0.1869 so a previous cached AppExpiry identity does not exactly match.
          NOTES

          gh release create v1.4.0 build/uk.551.signalbypass14_1.4.0_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.4.0' \
            --notes-file build/release-notes.md \
            --prerelease

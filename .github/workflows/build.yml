name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.4.7-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          BASELINE PRESERVED:
          v1.4.5 remains the known-good clean-login release.
          v1.4.6 remains the known-good login + unsupported-iOS-banner release.
          v1.4.7 is based directly on v1.4.6 and does not alter registration, SPQR, /v1/registration, /v2/keys, HTTP response handling, or the banner hook.

          New post-login compatibility work:

          1. Legacy Signal chat WebSocket modernization
          Signal 7.19.1 sends authenticated /v1/websocket/ credentials as login/password URL query parameters. Current Signal-Server expects HTTP Basic Authorization on the WebSocket upgrade. v1.4.7 strips those sensitive query values and moves them to the Authorization header.

          2. Retired unidentified host
          Signal 7.19.1 still uses ud-chat.signal.org for the anonymous socket. That hostname no longer resolves. v1.4.7 routes that anonymous /v1/websocket/ connection to chat.signal.org, matching the modern unified chat service.

          3. CDSI contact-discovery enclave
          Signal 7.19.1 embeds CDSI MRENCLAVE:
          0f6fd79cdfdaa5b2e6337f534d3baf999318b0c462a7ac1f41297a3e4b424a57

          The supplied working Signal 8.29 IPA (LibSignalClient 0.102.0) contains the current CDSI production MRENCLAVE:
          15637fa1e54fe655176d3df1a9f94b87c01ed377acaa570682dc5d72c95ef07b

          v1.4.7 replaces only that 64-byte constant in the loaded SignalServiceKit __TEXT mapping before CDSI is initialized. This keeps the old CDSv2 protocol implementation but points its URL path and SGX attestation verification at the current enclave.

          4. WebSocket User-Agent
          Signal WebSockets use the same proven server-facing identity:
          Signal-iOS/8.29.0.1866 iOS/16.2

          Sensitive WebSocket login/password values are never written to the tweak log.

          Persistent trace:
          Documents/SignalBypass14-Registration.log
          NOTES

          gh release create v1.4.7 build/uk.551.signalbypass14_1.4.7_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.4.7' \
            --notes-file build/release-notes.md \
            --prerelease

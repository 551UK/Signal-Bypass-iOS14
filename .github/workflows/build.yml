name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg protobuf

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.14-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.13 fixed the original sender-side block: messages reach
          /v1/messages and the sender UI reaches one tick. A modern receiving
          phone then reports "A message from ... could not be delivered", and
          modern -> iOS 14 messages also fail to become visible.

          The important compatibility fact is now concrete:
          - Signal 7.19.1 bundles libsignal 0.52
          - SPQR was integrated in libsignal 0.74 as an opt-in/downgrade protocol
          - current Signal-Server requires new devices to advertise the public
            "spqr" capability at registration
          - our registration shim had to inject spqr=true even though 0.52
            cannot actually participate in SPQR sessions

          Current Signal-Server also exposes authenticated
          PUT /v1/devices/capabilities. v1.5.14 uses the already-authenticated
          chat websocket credentials to correct this device to spqr=false after
          registration, allowing modern peers to negotiate/downgrade correctly.

          The correction body truthfully retains the old client's transfer
          capability, clears storage rather than falsely claiming an SVR backup,
          and includes legacy capability names (ignored by current server).
          No message/session crypto is bypassed.

          v1.5.14 also adds content-safe inbound crypto stage tracing:
          - Sealed Sender unwrap
          - USMC / SignalMessage / PreKey deserialization
          - whisper/prekey session decrypt result and libsignal error type/message

          Expected markers:
          - SPQR-CAPABILITY correcting stored device capability to false
          - SPQR-CAPABILITY response status=2xx result=ok
          - INBOUND SEALED-UNWRAP ...
          - INBOUND SESSION-DECRYPT ...
          NOTES

          gh release create v1.5.14 build/uk.551.signalbypass14_1.5.14_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.14' \
            --notes-file build/release-notes.md \
            --prerelease

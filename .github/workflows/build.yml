name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.1-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.1 discards the v1.5.0 forced-libsignal transport experiment.
          v1.5.0 caused outgoing messages to fail immediately.

          v1.5.1 is rebuilt from the proven v1.4.6 runtime/login/banner code and
          explicitly resets the three app-group transport preferences to false:
          - UseLibsignalForIdentifiedWebsocket
          - UseLibsignalForUnidentifiedWebsocket
          - EnableShadowingForUnidentifiedWebsocket

          This matters because v1.5.0 persisted those values; merely downgrading
          the dylib would not necessarily restore the original transport.

          Metadata test:
          - restore the real Signal app identity: 7.19.1 (208)
          - keep only BuildDetails.Timestamp = 1821655572
          - keep only BuildDetails.DateTime = Wed Sep 22 23:26:12 UTC 2027

          This matches the working comparison more closely than the older builds,
          which also changed CFBundleShortVersionString/CFBundleVersion.

          Preserved from v1.4.6:
          - fresh verification/login compatibility
          - spqr=true registration compatibility
          - /v1/registration handling
          - /v2/keys handling
          - chat.signal.org NSURLSession User-Agent compatibility
          - unsupported-iOS banner suppression

          No websocket URL/auth rewriting is included.
          NOTES

          gh release create v1.5.1 build/uk.551.signalbypass14_1.5.1_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.1' \
            --notes-file build/release-notes.md \
            --prerelease

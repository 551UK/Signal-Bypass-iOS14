name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.4.9-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.4.9 is rebuilt directly from the proven v1.4.6 login/banner code.
          No v1.4.7 or v1.4.8 WebSocket experiment is included.

          Why this test:
          - v1.4.6 obtains /v1/certificate/delivery -> HTTP 200
          - outgoing messages remain spinning
          - FLEX shows no subsequent /v1/messages submission
          - Signal 7.19.1 checks appExpiry.isExpired before entering the message-send pipeline
          - AppExpiry persists an "immediately expired" state keyed by currentAppVersion after a server 499
          - the user's comparison device reportedly works after moving BuildDetails into 2027

          v1.4.9 changes only local expiry identity/metadata:
          - local spoof stays 8.29
          - bundle build advances from 1870 to 1871, giving AppExpiry a new currentAppVersion identity so an older persisted immediate-expiry record is not restored
          - BuildDetails.Timestamp = 1821655572
          - BuildDetails.DateTime = Wed Sep 22 23:26:12 UTC 2027

          Preserved exactly from v1.4.6:
          - fresh verification/login compatibility
          - spqr=true registration field
          - /v1/registration handling
          - /v2/keys handling
          - chat.signal.org REST User-Agent rewrite
          - unsupported-iOS banner suppression

          This build intentionally does not alter the legacy WebSocket path.
          NOTES

          gh release create v1.4.9 build/uk.551.signalbypass14_1.4.9_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.4.9' \
            --notes-file build/release-notes.md \
            --prerelease

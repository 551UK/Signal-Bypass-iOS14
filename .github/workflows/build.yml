name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.9-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.8 finally reached native CDSI:
          - remote config translation fired and selected native CDSI
          - /v2/directory/auth returned 200
          - the CDSI websocket opened with HTTP 101
          - Signal 7.19.1 then closed it locally with code 1007 before any
            client handshake frame was sent

          Signal 7.19.1 bundles libsignal 0.52, whose CDSI client uses classic
          Noise_NK_25519_ChaChaPoly_SHA256. Current CDSI uses the hybrid
          post-quantum Noise_NKhfs_25519+Kyber1024 protocol. The Signal CDSI
          source tree also retains a legacy enclave branch matching the old
          0f6fd79 enclave measurement.

          v1.5.9 is a one-variable compatibility test:
          - keep native CDSI selection from v1.5.8
          - keep the original 0f6fd79... CDSI enclave/path instead of rewriting
            it to the current enclave
          - preserve CDSI Basic auth and modern User-Agent
          - log inbound CDSI frame sizes as well as outbound sizes
          - keep all working chat websocket, registration, and expiry fixes

          Success path should show:
          - CDSI-ENCLAVE mode=legacy pathMatches=yes
          - CDSI WS-OPEN HTTP 101
          - CDSI WS-FRAME IN (attestation)
          - CDSI WS-FRAME OUT (old Noise handshake)
          - further CDSI frames, then /v1/messages/<recipient>

          If the old enclave endpoint is retired, the websocket status/close
          in this build will establish that directly.
          NOTES

          gh release create v1.5.9 build/uk.551.signalbypass14_1.5.9_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.9' \
            --notes-file build/release-notes.md \
            --prerelease

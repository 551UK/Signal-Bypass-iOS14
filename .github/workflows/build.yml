name: Build retained iOS 14 source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg protobuf
      - name: Build and inspect rootful package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.13-rootful
          path: build/*.deb
          if-no-files-found: error

name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.2-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.2 keeps the v1.5.1 registration, expiry, and legacy-transport baseline.

          Device result from v1.5.1:
          - outgoing messages return to spinning/no one-tick
          - the v1.5.0 forced-libsignal path is therefore not retained

          This build tests one narrower legacy websocket combination:
          - keep Signal 7.19.1's login/password query authentication unchanged
          - do not convert websocket authentication to HTTP Basic
          - map retired ud-chat.signal.org to chat.signal.org for the anonymous socket
          - apply Signal-iOS/8.29.0.1866 iOS/16.2 only to the websocket upgrade
          - preserve the /v1/websocket/ path and existing session/request headers

          Preserved:
          - Signal 7.19.1 (208) local identity with 2027 BuildDetails
          - fresh verification/login compatibility
          - spqr=true registration compatibility
          - /v1/registration and /v2/keys handling
          - unsupported-iOS banner suppression
          - all three libsignal transport preferences reset to false

          No response rewriting, CDSI changes, or forced libsignal transport.
          NOTES

          gh release create v1.5.2 build/uk.551.signalbypass14_1.5.2_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.2' \
            --notes-file build/release-notes.md \
            --prerelease

name: Build iOS 14 DEB
on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - StartupDiagnostics.h
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Build and inspect rootful package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.0.0-rootful
          path: build/*.deb
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental build for Signal 7.19.1 (208), rootful iOS 14.

          Rootful architecture fix. The supplied FuckSignalExpiry package that previously injected successfully contains both arm64 and arm64e slices. Earlier SignalBypass14 builds contained only arm64, which can prevent MobileSubstrate from loading the dylib into an arm64e Signal process on A12-and-newer devices.

          v1.0.0 now builds a universal arm64 + arm64e rootful dylib and verifies both slices in CI. The rootful /Library/MobileSubstrate/DynamicLibraries layout and iphoneos-arm package architecture remain unchanged because those already match the known-working reference package.

          The visible "SB14 v1.0 loaded" canary remains so injection is obvious.
          NOTES
          gh release create v1.0.0 build/uk.551.signalbypass14_1.0.0_iphoneos-arm.deb --target "$GITHUB_SHA" --title 'Signal Bypass iOS 14 v1.0.0' --notes-file build/release-notes.md --prerelease

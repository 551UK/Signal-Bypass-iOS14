name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg protobuf

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.13-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.13 keeps the v1.5.12 CDSI changes and targets a separate
          compatibility break in Sealed Sender certificates.

          Signal 7.19.1/libsignal 0.52 expects:
          - sender UUID as protobuf field 6 string
          - an embedded ServerCertificate in field 5
          - the original production Sealed Sender trust root

          Current Signal-Server generates:
          - sender UUID as 16-byte field 7
          - signer as referenced certificate id in field 8
          - production signer id 3, chained to the newer production trust root

          This build:
          - checks out the exact libsignal v0.52.0 source used by the old client
          - changes only SenderCertificate protobuf parsing/encoding compatibility
          - resolves known signer ids 2/3 to Signal's published server certificates
          - keeps SenderCertificate's Rust struct layout unchanged
          - hooks only sender-certificate deserialize/destroy/validate
          - validates against both the legacy and current production trust roots
          - does not bypass certificate signatures or expiry validation
          - preserves the original serialized certificate bytes, so the server
            signature remains valid and the same certificate is sent to recipients
          - keeps all non-certificate Signal 7.19.1 crypto on its original libsignal

          Expected log markers:
          - SENDER-CERT bridge: parser=v0.52-modernized ... hooks=ready
          - SENDER-CERT deserialize ... result=ok
          - SENDER-CERT validate ... valid=yes
          - then CDSI/session setup and /v1/messages/<recipient>
          NOTES

          gh release create v1.5.13 build/uk.551.signalbypass14_1.5.13_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.13' \
            --notes-file build/release-notes.md \
            --prerelease

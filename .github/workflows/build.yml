name: Build iOS 14 DEB
on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - StartupDiagnostics.h
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Build and inspect rootful package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-0.6.0-rootful
          path: build/*.deb
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental build for Signal 7.19.1 (208), rootful iOS 14.

          v0.6 targets the fact that v0.5 produced the same generic-error -> Update Required sequence and its Documents log was not visible.

          Foundation uses private concrete class-cluster implementations on iOS. This build hooks the concrete NSMutableURLRequest, NSURLSession and NSHTTPURLResponse classes so the Signal 8.29.0.1866 User-Agent rewrite and HTTP 499 interception happen on the objects actually used by Signal 7.19.1.

          Local synthetic build is 8.29.0.1869. If registration still fails, the generic-error / update alert itself is temporarily annotated with a safe SB14 diagnostic line showing only whether a Signal request was seen, host, HTTP status and User-Agent. No phone number, URL path, token or request body is shown.
          NOTES
          gh release create v0.6.0 build/uk.551.signalbypass14_0.6.0_iphoneos-arm.deb --target "$GITHUB_SHA" --title 'Signal Bypass iOS 14 v0.6.0' --notes-file build/release-notes.md --prerelease

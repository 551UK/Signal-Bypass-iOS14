name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.4-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.3 proved the websocket upgrade now succeeds with HTTP 101 and
          encrypted websocket frames move in both directions, but outgoing
          messages still remain on the spinning indicator.

          v1.5.4 keeps the v1.5.3 transport/auth changes unchanged and adds
          content-safe parsing of Signal's outer websocket protobuf envelope:
          - request id
          - request method
          - request path with recipient identifiers redacted
          - matching response status
          - response message byte count only
          - authenticated vs anonymous socket indicator

          It does not log message bodies, websocket headers, credentials,
          recipient identifiers, encrypted payload contents, or response text.

          This should show whether /v1/messages/<recipient> leaves the old
          client and exactly which server status is returned.

          Preserved:
          - websocket query credentials -> HTTP Basic
          - ud-chat.signal.org -> chat.signal.org
          - Signal 8.29/iOS 16.2 websocket User-Agent
          - Signal 7.19.1 (208) local identity with 2027 BuildDetails
          - registration/login, spqr=true and /v2/keys compatibility
          - unsupported-iOS banner suppression
          - legacy SSK transport with libsignal flags reset to false
          NOTES

          gh release create v1.5.4 build/uk.551.signalbypass14_1.5.4_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.4' \
            --notes-file build/release-notes.md \
            --prerelease

name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.5-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.4 proved the websocket path is healthy: both sockets upgrade
          with HTTP 101 and normal authenticated requests return 200, but the
          actual /v1/messages/<recipient> request never begins.

          v1.5.5 keeps all v1.5.4 websocket/auth behavior and adds two targeted
          changes for the pre-send stage:
          - restores the Signal 8.29 CDSI enclave measurement compatibility patch
          - logs method/redacted path/status for all Signal HTTP tasks

          This is aimed at the old MessageSender path before message submission:
          sender-certificate fetch, contact discovery, recipient prekey/session
          setup and any REST fallback can now be distinguished without logging
          message bodies, credentials, recipient IDs, headers or response text.

          Preserved:
          - websocket query credentials -> HTTP Basic
          - ud-chat.signal.org -> chat.signal.org
          - Signal 8.29/iOS 16.2 websocket User-Agent
          - websocket protobuf request/response-status diagnostics
          - Signal 7.19.1-era client state with the existing BuildDetails handling
          - registration/login, spqr=true and /v2/keys compatibility
          - unsupported-iOS banner suppression
          - legacy SSK transport with libsignal flags reset to false
          NOTES

          gh release create v1.5.5 build/uk.551.signalbypass14_1.5.5_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.5' \
            --notes-file build/release-notes.md \
            --prerelease

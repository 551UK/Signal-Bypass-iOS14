name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg protobuf

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.12-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.11 confirmed the runtime byte patch was not enough:
          - the helper reported one c6ff... constant patched
          - current CDSI still opened with HTTP 101 and delivered 24,988-byte attestation
          - libsignal 0.71 still rejected INTEL-SA-00615
          - no /v1/messages/<recipient> request was created

          v1.5.12 removes that fragile post-load patch. Instead the build:
          - checks out official libsignal v0.71.0 at commit
            eac4cf58ed9b102778b477a9657d4a348cf28f9c
          - changes only rust/attest/src/constants.rs ENCLAVE_ID_CDSI from the
            retired c6ff0682... measurement to current 15637fa1...
          - compiles libsignal-ffi for aarch64-apple-ios using Signal's own
            swift/build_ffi.sh (which targets iOS 13)
          - links that source-patched library only into SignalCdsiPQBridge
          - preserves v0.71's existing INTEL-SA-00615/00657 allowance and
            post-quantum Noise implementation
          - leaves Signal 7.19.1's original libsignal 0.52 in place for all
            non-CDSI cryptography

          SGX attestation is still fully performed; no attestation check is disabled.

          Expected success markers:
          - PQ-CDSI helper: libsignal 0.71 source-compiled...
          - PQ-CDSI new ... result=ok
          - PQ-CDSI initialRequest ... result=ok
          - CDSI WS-FRAME OUT
          - PQ-CDSI completeHandshake ... result=ok
          - establishedSend/Recv followed by /v1/messages/<recipient>
          NOTES

          gh release create v1.5.12 build/uk.551.signalbypass14_1.5.12_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.12' \
            --notes-file build/release-notes.md \
            --prerelease

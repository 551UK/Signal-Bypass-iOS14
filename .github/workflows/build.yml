name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.3.0-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental rootful build for Signal 7.19.1 (208) on iOS 14.

          v1.3.0 is the minimal expiry-functions test. It removes the network interception, HTTP status rewriting, diagnostic popups/logging, OS spoofing, and runtime bundle hooks from the previous diagnostic builds.

          Runtime hooks are limited to the identified SignalServiceKit expiry/update paths:
          - AppExpiryImpl.isExpired -> false
          - setHasAppExpiredAtCurrentVersion(db:) -> no-op
          - AppExpiryImpl.appExpiredStatusCode -> 0
          - RegistrationSession.hasUnknownChallengeRequiringAppUpdate -> false
          - small Objective-C expiry fallbacks when visible

          The installer gives Signal a fresh local AppVersion identity, 8.29.0.1868, with BuildDetails timestamp 22 Sep 2026 17:00 UTC so an AppExpiry state stored under 8.29.0.1867 does not match the current local identity.
          NOTES

          gh release create v1.3.0 build/uk.551.signalbypass14_1.3.0_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.3.0' \
            --notes-file build/release-notes.md \
            --prerelease

name: Build iOS 14 DEB
on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - StartupDiagnostics.h
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Build and inspect rootful package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-0.8.0-rootful
          path: build/*.deb
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental build for Signal 7.19.1 (208), rootful iOS 14.

          v0.8 targets the two actual pure-Swift sources of RegistrationStep.appUpdateBanner in Signal 7.19.1.

          The exact exported Swift symbols from the supplied 7.19.1 SignalServiceKit binary are hooked with MSHookFunction: AppExpiryImpl.isExpired returns false, setHasAppExpiredAtCurrentVersion is suppressed, appExpiredStatusCode returns 0, and RegistrationSession.hasUnknownChallengeRequiringAppUpdate returns false. This is different from earlier Objective-C swizzling and reaches the Swift implementations used by registration.

          The v0.3 launch fix remains and the exact 8.29.0.1866 persisted metadata from v0.7 is retained. If Update Required somehow still appears, the alert now shows an SB14 v0.8 line with the number of Swift symbols hooked plus safe host/status/User-Agent diagnostics.
          NOTES
          gh release create v0.8.0 build/uk.551.signalbypass14_0.8.0_iphoneos-arm.deb --target "$GITHUB_SHA" --title 'Signal Bypass iOS 14 v0.8.0' --notes-file build/release-notes.md --prerelease

name: Build iOS 14 DEB
on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - StartupDiagnostics.h
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Build and inspect rootful package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-0.4.0-rootful
          path: build/*.deb
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental build for Signal 7.19.1 (208), rootful iOS 14.

          Registration-focused build based on the v0.3.0 launch-working baseline. Keeps the NSProcessInfo iOS 10000 override removed.

          Signal 7.19.1 treats HTTP 499 from the service as an immediate app-expiry signal. This build forces requests to Signal service hosts to use the exact supplied Signal 8.29 network identity (Signal-iOS/8.29.0.1866 iOS/16.3) instead of rewriting a 499 response after the server has already rejected the request.

          The local synthetic build is 8.29.0.1867 so a 499 expiry state persisted by the previous test build is not restored on launch. Startup diagnostics remain enabled.
          NOTES
          gh release create v0.4.0 build/uk.551.signalbypass14_0.4.0_iphoneos-arm.deb --target "$GITHUB_SHA" --title 'Signal Bypass iOS 14 v0.4.0' --notes-file build/release-notes.md --prerelease

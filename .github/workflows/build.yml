name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.4.1-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental rootful build for Signal 7.19.1 (208) on iOS 14.

          v1.4.1 keeps the v1.4.0 final NSURLSession User-Agent rewrite that removed the Update Required popup.

          It adds sanitized logging around the completion-handler registration requests used by Signal 7.19.1. The log records the final request method/path/User-Agent and the real HTTP response status/body for /v1/verification/session requests.

          Sensitive values including session IDs, phone numbers, push tokens, verification codes, credentials and auth values are redacted.

          Log path inside Signal's sandbox:
          Documents/SignalBypass14-Registration.log

          No HTTP status rewriting, Swift expiry hooks, X-Signal-Agent injection, request-body modification or diagnostic popups are added.
          NOTES

          gh release create v1.4.1 build/uk.551.signalbypass14_1.4.1_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.4.1' \
            --notes-file build/release-notes.md \
            --prerelease

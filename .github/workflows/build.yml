name: Build iOS 14 DEB
on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - StartupDiagnostics.h
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Build and inspect rootful package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.1.1-rootful
          path: build/*.deb
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental build for Signal 7.19.1 (208), rootful iOS 14.

          Stability rollback build.

          v1.1.0 caused Signal to terminate on launch. v1.1.1 restores the exact runtime hook ordering and constructor behavior from v1.0.4, the last build confirmed to open Signal normally on the test device.

          No new registration hooks are introduced in this build. It keeps the arm64+arm64e rootful dylib, 0755 permissions, persisted 8.29.0.1866 metadata and the v1.0.4 compatibility hooks.
          NOTES
          gh release create v1.1.1 build/uk.551.signalbypass14_1.1.1_iphoneos-arm.deb --target "$GITHUB_SHA" --title 'Signal Bypass iOS 14 v1.1.1' --notes-file build/release-notes.md --prerelease

name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.6-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.5 showed a concrete pre-send failure pattern:
          - /v2/directory/auth repeatedly succeeds with HTTP 200
          - legacy /v1/config repeatedly returns HTTP 404
          - no /v1/messages/<recipient> request is ever created

          Signal 7.19.1 defaults CDSI lookups to its old libsignal networking path
          when the remote flag is absent. Because /v1/config is retired, that flag
          never refreshes. v1.5.6 therefore:
          - rewrites /v1/config/ to the modern /v2/config/ endpoint
          - translates the response to Signal 7.19.1's old config schema
          - explicitly sets ios.cdsiLookup.libsignal=false
          - keeps both chat libsignal flags and websocket shadowing false
          - restores/retains the Signal 8.29 CDSI MrEnclave patch
          - applies the 8.29/iOS 16.2 UA to native CDSI websocket creation
          - logs CDSI websocket open/frame/close state without payload contents

          Existing registration, expiry, websocket Basic-auth and message-status
          diagnostics are preserved.
          NOTES

          gh release create v1.5.6 build/uk.551.signalbypass14_1.5.6_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.6' \
            --notes-file build/release-notes.md \
            --prerelease

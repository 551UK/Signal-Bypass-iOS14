name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.10-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.9 established that the original 0f6fd79 CDSI enclave endpoint
          is retired: /v1/<old-enclave>/discovery returns HTTP 404.

          v1.5.8 had already shown the current enclave does accept the websocket
          upgrade (HTTP 101), but Signal 7.19.1 closes it with code 1007 before
          emitting a client handshake. The remaining incompatibility is the
          CDSI Noise protocol: Signal 7.19.1 uses libsignal 0.52 pre-PQ Noise;
          current CDSI requires post-quantum NKhfs+Kyber1024.

          v1.5.10 adds a narrow compatibility bridge:
          - restores the current 15637fa... CDSI enclave
          - bundles Signal's official libsignal 0.71 iOS FFI build
          - 0.71 is the first release where CDSI selects PostQuantum Noise
          - its podspec still supports iOS 13, so it is suitable for iOS 14
          - hooks only Cds2Client/SGX functions for CDSI-created handles
          - all other Signal 7.19.1 libsignal calls remain on 0.52
          - routes buffer/error cleanup back to the library that allocated it
          - retains remote-config, registration, expiry, and chat websocket fixes

          Expected success markers:
          - PQ-CDSI bridge: libsignal=0.71 helper=ready hooks=ready
          - CDSI-ENCLAVE mode=current-pq
          - WS-OPEN target=cdsi.signal.org ... http=101
          - WS-FRAME IN target=cdsi.signal.org ... (attestation)
          - PQ-CDSI new ... result=ok
          - PQ-CDSI initialRequest ... bytes around the PQ handshake size
          - WS-FRAME OUT target=cdsi.signal.org ...
          - PQ-CDSI completeHandshake ... result=ok
          - then establishedSend/Recv and eventually /v1/messages/<recipient>
          NOTES

          gh release create v1.5.10 build/uk.551.signalbypass14_1.5.10_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.10' \
            --notes-file build/release-notes.md \
            --prerelease

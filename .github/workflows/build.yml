name: Build iOS 14 DEB
on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - StartupDiagnostics.h
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Build and inspect rootful package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.0.3-rootful
          path: build/*.deb
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental build for Signal 7.19.1 (208), rootful iOS 14.

          Runtime marker diagnostic build based on the last known-compiling rootful package layout.

          v1.0.3 writes SignalBypass14-runtime-marker.txt directly into Signal's Documents directory as the first action of the dylib constructor, before version checks or hook setup. It also attempts marker writes in the process temporary directory and /tmp.

          This avoids relying on the delayed UIKit popup. The existing arm64+arm64e rootful package, 0755 dylib permissions, launch fix and registration hooks are otherwise unchanged.
          NOTES
          gh release create v1.0.3 build/uk.551.signalbypass14_1.0.3_iphoneos-arm.deb --target "$GITHUB_SHA" --title 'Signal Bypass iOS 14 v1.0.3' --notes-file build/release-notes.md --prerelease

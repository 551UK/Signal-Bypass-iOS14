name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.8-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.7 showed:
          - the exported Swift RemoteConfig.cdsiLookupWithLibsignal symbol was hooked
          - that thunk was never called by the optimized Signal 7.19.1 send path
          - /v2/config and /v2/directory/auth still repeat
          - no CDSI websocket and no /v1/messages/<recipient> request appears

          v1.5.8 moves the compatibility shim to the concrete response object
          Signal 7.19.1 actually parses:
          - hooks HTTPResponseImpl.responseBodyJson and bodyJson
          - for only /v1/config or /v2/config, returns the legacy array schema
          - sets ios.cdsiLookup.libsignal=false
          - keeps legacy chat transport/libsignal/shadowing flags false
          - leaves every non-config response untouched
          - retains the 8.29 CDSI MrEnclave patch and chat websocket fixes

          Expected log markers:
          - Remote-config HTTPResponse hooks: ... bodyJson=yes responseBodyJson=yes
          - REMOTE-CONFIG HTTPResponseImpl translated to Signal-7.19 schema
          - CDSI-WEBSOCKET host=cdsi.signal.org ...
          - then recipient key/session work and /v1/messages/<recipient>
          NOTES

          gh release create v1.5.8 build/uk.551.signalbypass14_1.5.8_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.8' \
            --notes-file build/release-notes.md \
            --prerelease

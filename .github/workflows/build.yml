name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.11-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.10 reached the current CDSI service and exposed the exact next
          failure:
          - /v2/directory/auth returned 200
          - CDSI websocket upgraded with HTTP 101
          - a 24,988-byte attestation frame was received
          - bundled libsignal 0.71 rejected the attestation with:
            TCB contains unmitigated unaccepted advisory ids: INTEL-SA-00615

          libsignal 0.71 already treats INTEL-SA-00615 and INTEL-SA-00657 as
          acceptable for its known CDSI enclave, but that allowlist is keyed to
          its older c6ff0682... enclave measurement. The live service now uses
          15637fa1....

          v1.5.11 changes only that compatibility point:
          - retains libsignal 0.71 because its podspec supports iOS 13/14
          - patches the bundled helper's raw 32-byte CDSI enclave allowlist key
            from c6ff0682... to 15637fa1... after dlopen
          - does not disable SGX attestation or skip verification
          - retains current post-quantum Noise, CDSI Basic auth, and current path
          - keeps Signal 7.19.1 libsignal 0.52 for all non-CDSI crypto

          Expected success markers:
          - PQ-CDSI 0.71 enclave allowlist patch: ready
          - PQ-CDSI new ... result=ok
          - PQ-CDSI initialRequest ... result=ok
          - CDSI WS-FRAME OUT
          - PQ-CDSI completeHandshake ... result=ok
          - establishedSend/Recv followed by /v1/messages/<recipient>
          NOTES

          gh release create v1.5.11 build/uk.551.signalbypass14_1.5.11_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.11' \
            --notes-file build/release-notes.md \
            --prerelease

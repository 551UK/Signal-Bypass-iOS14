name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.4.5-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental rootful build for Signal on iOS 14.

          v1.4.4 proved the account-creation stage now succeeds:
          - verification session completes with verified=true
          - POST /v1/registration includes spqr=true
          - POST /v1/registration -> HTTP 200

          The next request is PUT /v2/keys. FLEX showed that request still leaves with the old Signal-iOS/7.40.0.1870 iOS/18 User-Agent and receives an empty HTTP 499.

          v1.4.5 keeps the working verification and SPQR registration changes, but broadens the final User-Agent compatibility rewrite to every request whose host is chat.signal.org:
          Signal-iOS/8.29.0.1866 iOS/16.2

          This avoids repeating the same remote-deprecation failure on each authenticated Signal service endpoint. It does not rewrite HTTP responses and does not modify /v2/keys data.

          The persistent trace now also includes /v2/keys. Large key-upload request bodies are omitted from the log, and access-key fields receive stronger redaction.

          Log path: Documents/SignalBypass14-Registration.log

          Important: SPQR is still being advertised solely to satisfy current server registration requirements. Long-term protocol compatibility of this old client remains under test.
          NOTES

          gh release create v1.4.5 build/uk.551.signalbypass14_1.4.5_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.4.5' \
            --notes-file build/release-notes.md \
            --prerelease

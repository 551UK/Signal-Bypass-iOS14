name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.0-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.0 targets the post-login send/receive transport failure.

          Evidence:
          - v1.4.6 registration works and /v1/certificate/delivery returns HTTP 200.
          - outgoing messages remain queued/spinning and never reach /v1/messages.
          - incoming messages sent by a working iOS 16 client remain at one tick and never appear.
          - FLEX shows Signal 7.19.1 repeatedly using its legacy SSK websocket transport.
          - Signal 7.19.1 source already contains an alternate LibSignalClient.Net chat transport.
          - ChatConnectionManagerImpl selects that transport at startup from these app-group UserDefaults:
            UseLibsignalForIdentifiedWebsocket
            UseLibsignalForUnidentifiedWebsocket

          v1.5.0 forces both transport switches to true before ChatConnectionManagerImpl is constructed and disables unidentified shadowing.

          It does NOT rewrite websocket URLs or move credentials between query/header forms.

          Preserved:
          - verification/session UA compatibility
          - spqr=true registration compatibility
          - /v1/registration handling
          - /v2/keys handling
          - chat.signal.org NSURLSession UA compatibility
          - unsupported-iOS banner suppression
          - 2027 BuildDetails expiry test

          Local spoof build advances to 1872 so any AppExpiry record created under 1871 is not restored.
          NOTES

          gh release create v1.5.0 build/uk.551.signalbypass14_1.5.0_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.0' \
            --notes-file build/release-notes.md \
            --prerelease

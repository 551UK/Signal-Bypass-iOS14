name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.4.4-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental rootful build for Signal on iOS 14.

          v1.4.4 keeps the complete verification-session flow that reaches verified=true.

          The v1.4.3 trace proved the next request, POST /v1/registration, reaches the server with the spoofed Signal 8.29 User-Agent but is rejected with HTTP 499 and:
          Missing required device capability

          Current Signal-Server requires the SPQR capability for new device registration. The old client sends a legacy capabilities map without spqr.

          This build changes only the JSON body of POST /v1/registration:
          accountAttributes.capabilities.spqr = true

          It does not rewrite HTTP statuses or server responses, and it does not alter the verified session ID, auth, account keys, push token, or verification code.

          Persistent sanitized logging remains enabled at:
          Documents/SignalBypass14-Registration.log

          This is a compatibility probe. A final release still needs validation that the old client can safely operate with the capability it advertises.
          NOTES

          gh release create v1.4.4 build/uk.551.signalbypass14_1.4.4_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.4.4' \
            --notes-file build/release-notes.md \
            --prerelease

name: Build iOS 14 DEB
on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - StartupDiagnostics.h
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Build and inspect rootful package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-0.9.0-rootful
          path: build/*.deb
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental build for Signal 7.19.1 (208), rootful iOS 14.

          v0.9 proves whether the tweak dylib is actually loading before we change more registration logic.

          Signal should display an "SB14 v0.9 loaded" alert about three seconds after launch. It shows whether MSHookMessageEx and MSHookFunction resolved and how many expected Swift hooks installed. The startup log no longer depends on the process name being exactly Signal.

          The MobileSubstrate filter now targets only the main Signal bundle, matching the known-working FuckSignalExpiry package. Existing v0.8 registration hooks remain unchanged.
          NOTES
          gh release create v0.9.0 build/uk.551.signalbypass14_0.9.0_iphoneos-arm.deb --target "$GITHUB_SHA" --title 'Signal Bypass iOS 14 v0.9.0' --notes-file build/release-notes.md --prerelease

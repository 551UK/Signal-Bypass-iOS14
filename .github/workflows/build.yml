name: Build iOS 14 DEB
on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - StartupDiagnostics.h
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Build and inspect rootful package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-0.7.0-rootful
          path: build/*.deb
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental build for Signal 7.19.1 (208), rootful iOS 14.

          v0.7 changes the version spoof from runtime-only to persisted app metadata.

          The supplied Signal 7.19.1 app's Info.plist is now backed up, then its CFBundleShortVersionString, CFBundleVersion and BuildDetails are changed to the exact values from the supplied working Signal 8.29 (1866) IPA. This makes Signal's own Swift AppVersionImpl create 8.29.0.1866 natively instead of depending on Objective-C Bundle hooks.

          The v0.3 launch fix remains: the NSProcessInfo iOS-10000 override is still removed. The concrete networking hooks remain as a second layer. Uninstall restores the original 7.19.1 (208) metadata.
          NOTES
          gh release create v0.7.0 build/uk.551.signalbypass14_0.7.0_iphoneos-arm.deb --target "$GITHUB_SHA" --title 'Signal Bypass iOS 14 v0.7.0' --notes-file build/release-notes.md --prerelease

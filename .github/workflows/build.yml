name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.4.8-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          BASELINE PRESERVED:
          v1.4.5 remains the known-good clean-login release.
          v1.4.6 remains the known-good fresh-login + unsupported-iOS-banner release.
          v1.4.8 is rebuilt directly from v1.4.6.

          No CDSI/contact-discovery changes from the experimental v1.4.7 branch are included.

          The FLEX evidence for normal messaging showed two legacy WebSocket failures:
          - chat.signal.org/v1/websocket/?login=...&password=... -> bad server response
          - ud-chat.signal.org/v1/websocket/ -> hostname not found
          - both websocket upgrade requests still used the old Signal-iOS/7.40.0.1870 iOS/18 User-Agent

          Current Signal-Server uses the same /v1/websocket/ path, but authenticated connections use HTTP Basic Authorization. Anonymous connections use the same chat service without Authorization.

          v1.4.8 changes only the chat websocket upgrade:
          - routes retired ud-chat.signal.org to chat.signal.org
          - removes legacy login/password query parameters
          - converts them to an Authorization: Basic header for the identified socket
          - leaves the anonymous socket unauthenticated
          - applies Signal-iOS/8.29.0.1866 iOS/16.2 to the websocket upgrade

          Unchanged from v1.4.6:
          - fresh registration/login
          - spqr=true account creation compatibility
          - /v2/keys handling
          - REST request handling
          - unsupported-iOS banner suppression
          - BuildDate.m / Info.plist metadata
          - server responses are never forged or rewritten

          Sensitive websocket credentials are not written to the tweak log.

          Persistent trace:
          Documents/SignalBypass14-Registration.log
          NOTES

          gh release create v1.4.8 build/uk.551.signalbypass14_1.4.8_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.4.8' \
            --notes-file build/release-notes.md \
            --prerelease

name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.7-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.6 proved the modern /v2/config endpoint is reachable and returns
          HTTP 200, but the old client still repeatedly requests config plus
          /v2/directory/auth and never opens a CDSI websocket. The expected
          v2->legacy translation marker was also absent.

          v1.5.7 targets that exact branch selection:
          - hooks the Swift RemoteConfig.cdsiLookupWithLibsignal getter and forces false
          - also tries the Objective-C class getter as a compatibility fallback
          - remote-config response translation now triggers from the final /v2/config path
            even when NSURLSession internally re-enters the request hook
          - retains the Signal 8.29 CDSI MrEnclave patch
          - retains chat websocket Basic-auth/host/UA compatibility
          - retains content-safe HTTP and websocket diagnostics

          Expected new log markers:
          - CDSI remote-config force: ... swift=yes (or objc=yes)
          - CDSI-FLAG ... forced false
          - CDSI-WEBSOCKET host=cdsi.signal.org ...
          - then recipient key/session work followed by /v1/messages/<recipient>
          NOTES

          gh release create v1.5.7 build/uk.551.signalbypass14_1.5.7_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.7' \
            --notes-file build/release-notes.md \
            --prerelease

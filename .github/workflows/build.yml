name: Build iOS 16 Registration Tracer
on:
  push:
    branches: [main]
    paths:
      - ios16-tracer/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Build tracer package
        run: bash ios16-tracer/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalRegistrationTracer16-0.1.0
          path: ios16-tracer/build/*.deb
          if-no-files-found: error

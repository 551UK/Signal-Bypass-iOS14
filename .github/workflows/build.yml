name: Build iOS 14 DEB
on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - StartupDiagnostics.h
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Build and inspect rootful package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-0.3.0-rootful
          path: build/*.deb
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental build for Signal 7.19.1 (208), rootful iOS 14.

          Startup diagnostic build. Removes the NSProcessInfo iOS 10000 hook, retains expiry/date and app-version changes, and records startup checkpoints without changing database, keychain or UI state.

          Fully close Signal, install and respring, open Signal once and leave it for 25 seconds. Send Documents/SignalBypass14-startup.log from Signal's data container using Filza. If it crashes, include its .ips report. No message text, credentials or request bodies are logged.

          Black-screen cause is not yet confirmed. This build is for locating the startup failure; it is not a confirmed fix.
          NOTES
          gh release create v0.3.0 build/uk.551.signalbypass14_0.3.0_iphoneos-arm.deb --target "$GITHUB_SHA" --title 'Signal Bypass iOS 14 v0.3.0' --notes-file build/release-notes.md --prerelease

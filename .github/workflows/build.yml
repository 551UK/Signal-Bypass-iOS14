name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.4.3-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental rootful build for Signal on iOS 14.

          v1.4.3 keeps the verification-session behavior that now completes successfully through verified=true.

          The captured iOS 14 trace proved:
          - POST /v1/verification/session -> 200
          - PATCH verification session challenge -> 200
          - POST verification session /code -> 200
          - PUT verification session /code -> 200 with verified=true

          Signal then moves to POST /v1/registration to create/re-register the account. v1.4.3 extends the same proven final NSURLSession User-Agent rewrite to that endpoint:
          Signal-iOS/8.29.0.1866 iOS/16.2

          No request bodies, verification codes, HTTP statuses or server responses are modified.

          Logging now covers both verification-session traffic and POST /v1/registration, persists across Signal launches, and uses stronger redaction for session IDs, phone numbers, push challenges, auth values, tokens and key material.

          Log path: Documents/SignalBypass14-Registration.log
          NOTES

          gh release create v1.4.3 build/uk.551.signalbypass14_1.4.3_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.4.3' \
            --notes-file build/release-notes.md \
            --prerelease

name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.4.2-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental rootful build for Signal 7.19.1 (208) on iOS 14.

          v1.4.2 keeps the v1.4.0 final NSURLSession User-Agent rewrite that removed the Update Required popup.

          Logging is expanded specifically for side-by-side comparison with the successful iOS 16 trace. Every /v1/verification/session request now records:
          - sequence number
          - method and redacted path
          - original User-Agent before rewrite
          - final User-Agent after rewrite
          - X-Signal-Agent, Content-Type and Accept-Language
          - sanitized JSON request body
          - real HTTP response status
          - selected response headers
          - sanitized JSON response body
          - network error domain/code if present

          Session IDs, phone numbers, push tokens, verification codes, credentials and auth values are redacted.

          Log path: Documents/SignalBypass14-Registration.log

          No HTTP status rewriting, Swift expiry hooks, X-Signal-Agent injection, request-body modification or diagnostic popups are added.
          NOTES

          gh release create v1.4.2 build/uk.551.signalbypass14_1.4.2_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.4.2' \
            --notes-file build/release-notes.md \
            --prerelease

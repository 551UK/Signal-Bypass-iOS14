name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.4.6-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          IMPORTANT BASELINE:
          v1.4.5 is preserved unchanged as the known-good clean-login build. v1.4.6 is based directly on that working network/login code.

          v1.4.6 changes only the local unsupported-iOS reminder UI.

          Signal 7.19.1 hard-codes:
          - minimum iOS major version: 15
          - enforcement date: 2024-10-01 UTC

          That produces the banner:
          "Signal no longer works on this device. To use Signal again, update your device to a newer version of iOS."

          The BuildDetails Timestamp controls a separate app-expiry timer (build date + 90 days), so changing Timestamp/DateTime is not the correct fix for this specific iOS-expiry banner.

          This build hooks only Signal.ExpirationNagView's inherited setHidden: and forces that reminder view to remain hidden.

          Unchanged from v1.4.5:
          - verification/session flow
          - spqr=true registration compatibility field
          - POST /v1/registration behavior
          - PUT /v2/keys behavior
          - Signal 8.29 User-Agent rewrite on chat.signal.org
          - BuildDate.m / Info.plist timestamp values
          - HTTP responses are never rewritten

          Persistent trace remains:
          Documents/SignalBypass14-Registration.log
          NOTES

          gh release create v1.4.6 build/uk.551.signalbypass14_1.4.6_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.4.6' \
            --notes-file build/release-notes.md \
            --prerelease

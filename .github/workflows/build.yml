name: Build iOS 14 DEB

on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: brew install ldid dpkg

      - name: Build and inspect rootful package
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.5.3-rootful
          path: build/*.deb
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Rootful Signal iOS 14 compatibility build.

          v1.5.3 follows the v1.5.1 result where outgoing messages still spin with no one-tick.

          Current Signal-Server authenticates websocket upgrades from the HTTP
          Authorization header, while Signal 7.19.1 still places login/password
          in the websocket URL query. This build converts only that handshake:
          - login/password query -> HTTP Basic Authorization
          - retired ud-chat.signal.org -> chat.signal.org
          - websocket User-Agent -> Signal-iOS/8.29.0.1866 iOS/16.2

          It also adds content-free websocket diagnostics to the existing
          Documents/SignalBypass14-Registration.log:
          - upgrade open/close and HTTP status
          - NSURL error domain/code
          - encrypted websocket frame direction and byte count
          - no message bodies, credentials, recipient IDs, or frame contents

          Preserved:
          - Signal 7.19.1 (208) local identity with 2027 BuildDetails
          - registration/login, spqr=true and /v2/keys compatibility
          - unsupported-iOS banner suppression
          - legacy SSK transport with libsignal flags reset to false
          NOTES

          gh release create v1.5.3 build/uk.551.signalbypass14_1.5.3_iphoneos-arm.deb \
            --target "$GITHUB_SHA" \
            --title 'Signal Bypass iOS 14 v1.5.3' \
            --notes-file build/release-notes.md \
            --prerelease

name: Build iOS 14 DEB
on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - StartupDiagnostics.h
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Build and inspect rootful package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.0.2-rootful
          path: build/*.deb
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental build for Signal 7.19.1 (208), rootful iOS 14.

          Loader-parity build. The known-working FuckSignalExpiry rootful dylib has a direct Mach-O LC_LOAD_DYLIB dependency on /Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate and uses a binary MobileSubstrate filter plist. SignalBypass14 previously used runtime dlopen/dlsym and an XML plist.

          v1.0.2 now directly links CydiaSubstrate, verifies that load command in CI, converts the filter plist to binary form, and retains the already-correct arm64+arm64e slices and 0755 dylib mode.

          The visible "SB14 v1.0.2 loaded" canary remains.
          NOTES
          gh release create v1.0.2 build/uk.551.signalbypass14_1.0.2_iphoneos-arm.deb --target "$GITHUB_SHA" --title 'Signal Bypass iOS 14 v1.0.2' --notes-file build/release-notes.md --prerelease

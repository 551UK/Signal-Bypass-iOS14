name: Build iOS 14 DEB
on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - StartupDiagnostics.h
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Build and inspect rootful package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-0.5.0-rootful
          path: build/*.deb
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental build for Signal 7.19.1 (208), rootful iOS 14.

          Follow-up to the registration result where a generic error is immediately followed by Update Required.

          Keeps the v0.3.0 launch-working baseline and the unsafe NSProcessInfo iOS 10000 override removed. Forces the exact supplied Signal 8.29.0.1866 network identity both while request headers are written and at NSURLSession task creation.

          Local synthetic build is 8.29.0.1868 to isolate earlier persisted expiry state. HTTP 499 remains an error, but is exposed to Signal 7.19.1 as 400 so it cannot persist another app-expiry lock. The log records only host/status and User-Agent, never phone numbers or request bodies.
          NOTES
          gh release create v0.5.0 build/uk.551.signalbypass14_0.5.0_iphoneos-arm.deb --target "$GITHUB_SHA" --title 'Signal Bypass iOS 14 v0.5.0' --notes-file build/release-notes.md --prerelease

name: Build iOS 14 DEB
on:
  push:
    branches: [main]
    paths:
      - Tweak.m
      - StartupDiagnostics.h
      - BuildDate.m
      - control
      - SignalBypass14.plist
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Build and inspect rootful package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBypass14-1.1.0-rootful
          path: build/*.deb
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > build/release-notes.md <<'NOTES'
          Experimental build for Signal 7.19.1 (208), rootful iOS 14.

          Crash-safe runtime marker build.

          v1.0.3 used Foundation objects inside the earliest dylib constructor and caused Signal to close immediately on this device. v1.1.0 replaces that marker with plain C open/write/fsync/close calls only, before any Objective-C or UIKit diagnostic work.

          The marker remains SignalBypass14-runtime-marker.txt in Signal's Documents directory. The existing arm64+arm64e rootful package, 0755 dylib permissions, launch fix and registration hooks are otherwise unchanged.
          NOTES
          gh release create v1.1.0 build/uk.551.signalbypass14_1.1.0_iphoneos-arm.deb --target "$GITHUB_SHA" --title 'Signal Bypass iOS 14 v1.1.0' --notes-file build/release-notes.md --prerelease

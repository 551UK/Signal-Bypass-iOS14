name: Publish v0.1.0 DEB
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v0.1.0.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SignalBypass14-0.1.0-rootful
          run-id: 35728898638
          github-token: ${{ github.token }}
          path: dist
      - name: Publish existing tested build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deb=dist/uk.551.signalbypass14_0.1.0_iphoneos-arm.deb
          test -f "$deb"
          dpkg-deb --info "$deb"
          cat > notes.md <<'EOF'
          Initial experimental compatibility build for Signal 7.19.1 (208) on a rootful iOS 14 jailbreak.

          - Reports Signal 8.29 / build 1866 and iOS 16.3.
          - Refreshes the build timestamp to address default 90-day expiry.
          - Includes supplementary Objective-C expiry hooks and limited HTTP diagnostics.

          Install the DEB alongside Signal 7.19.1, then respring. Device functionality is not yet confirmed; this does not backport newer messaging protocols.

          This is the unchanged DEB from successful build 35728898638.
          EOF
          gh release create v0.1.0 "$deb" --target 659bb2e5a0951618b1bb31f3f312b612737549e3 --title "Signal Bypass iOS 14 v0.1.0" --notes-file notes.md --prerelease

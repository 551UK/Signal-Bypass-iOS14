name: Remove obsolete Signal DEBs below 1.4.6
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-old-signal-debs.yml]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == '551UK/Signal-Bypass-iOS14'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete the 24 confirmed obsolete DEB assets and verify preserved assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          repo = "551UK/Signal-Bypass-iOS14"
          assert os.environ["GITHUB_REPOSITORY"] == repo
          base = "https://api.github.com/repos/" + repo
          token = os.environ["GH_TOKEN"]
          targets = [{"id":582225295,"name":"uk.551.signalbypass14_1.4.5_iphoneos-arm.deb","tag":"v1.4.5"},{"id":581967431,"name":"uk.551.signalbypass14_1.4.4_iphoneos-arm.deb","tag":"v1.4.4"},{"id":581937280,"name":"uk.551.signalbypass14_1.4.3_iphoneos-arm.deb","tag":"v1.4.3"},{"id":581899897,"name":"uk.551.signalbypass14_1.4.2_iphoneos-arm.deb","tag":"v1.4.2"},{"id":581894153,"name":"uk.551.signalbypass14_1.4.1_iphoneos-arm.deb","tag":"v1.4.1"},{"id":581880953,"name":"uk.551.signalbypass14_1.4.0_iphoneos-arm.deb","tag":"v1.4.0"},{"id":581854497,"name":"uk.551.signalbypass14_1.3.0_iphoneos-arm.deb","tag":"v1.3.0"},{"id":581796237,"name":"uk.551.signalbypass14_1.2.0_iphoneos-arm.deb","tag":"v1.2.0"},{"id":581761320,"name":"uk.551.signalbypass14_1.1.1_iphoneos-arm.deb","tag":"v1.1.1"},{"id":581754416,"name":"uk.551.signalbypass14_1.1.0_iphoneos-arm.deb","tag":"v1.1.0"},{"id":581734451,"name":"uk.551.signalbypass14_1.0.4_iphoneos-arm.deb","tag":"v1.0.4"},{"id":581725931,"name":"uk.551.signalbypass14_1.0.3_iphoneos-arm.deb","tag":"v1.0.3"},{"id":581663650,"name":"uk.551.signalbypass14_1.0.1_iphoneos-arm.deb","tag":"v1.0.1.1"},{"id":581665635,"name":"uk.551.signalbypass14_1.0.1_iphoneos-arm.deb","tag":"v1.0.1"},{"id":581638976,"name":"uk.551.signalbypass14_1.0.0_iphoneos-arm.deb","tag":"v1.0.0"},{"id":581627673,"name":"uk.551.signalbypass14_0.9.0_iphoneos-arm.deb","tag":"v0.9.0"},{"id":581599247,"name":"uk.551.signalbypass14_0.8.0_iphoneos-arm.deb","tag":"v0.8.0"},{"id":581518878,"name":"uk.551.signalbypass14_0.7.0_iphoneos-arm.deb","tag":"v0.7.0"},{"id":581498031,"name":"uk.551.signalbypass14_0.6.0_iphoneos-arm.deb","tag":"v0.6.0"},{"id":581470378,"name":"uk.551.signalbypass14_0.5.0_iphoneos-arm.deb","tag":"v0.5.0"},{"id":581445338,"name":"uk.551.signalbypass14_0.4.0_iphoneos-arm.deb","tag":"v0.4.0"},{"id":581419399,"name":"uk.551.signalbypass14_0.3.0_iphoneos-arm.deb","tag":"v0.3.0"},{"id":581408899,"name":"uk.551.signalbypass14_0.2.0_iphoneos-arm.deb","tag":"v0.2.0"},{"id":581388039,"name":"uk.551.signalbypass14_0.1.0_iphoneos-arm.deb","tag":"v0.1.0"}]
          def api(path, method="GET"):
              req = urllib.request.Request(base + path, method=method, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          def assets():
              result = {}
              page = 1
              while True:
                  releases = api("/releases?per_page=100&page=" + str(page))
                  for release in releases:
                      for asset in release["assets"]:
                          result[asset["id"]] = {"id": asset["id"], "name": asset["name"], "tag": release["tag_name"]}
                  if len(releases) < 100:
                      return result
                  page += 1
          before = assets()
          target_ids = {t["id"] for t in targets}
          assert len(target_ids) == 24
          for target in targets:
              assert before.get(target["id"]) == target, "Asset identity changed; stopping before deletion"
              version = tuple(int(n) for n in target["name"].split("_")[1].split("."))
              assert version < (1, 4, 6), "Target does not precede cutoff"
              assert target["name"].startswith("uk.551.signalbypass14_") and target["name"].endswith(".deb")
          protected = {i: a for i, a in before.items() if i not in target_ids}
          assert any(a["tag"] == "v1.4.6" for a in protected.values())
          for target in targets:
              api("/releases/assets/" + str(target["id"]), method="DELETE")
              print("Deleted " + target["tag"] + ": " + target["name"], flush=True)
          after = assets()
          assert not (target_ids & set(after)), "Some targeted assets remain"
          assert all(after.get(i) == a for i, a in protected.items()), "Protected asset inventory changed"
          summary = "Deleted 24 SignalBypass14 DEB assets below v1.4.6. Verified all " + str(len(protected)) + " other assets remain. Release notes and tags retained."
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary + "\n")
          
